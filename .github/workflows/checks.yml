# Checagens a cada push e pull request: tipos, lint, formatação e testes do Jest, que também
# conferem se a dist/ versionada está igual a um build novo do código. O site não é publicado
# aqui: o GitHub Pages serve a branch main (Settings → Pages → Deploy from a branch → / root).
name: Checagens

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
